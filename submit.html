<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit your game — CrimDev</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="CrimDev logo">
      <span>CrimDev</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a class="current" href="submit.html">Submit your game</a>
    </nav>
  </header>

  <main class="submit-page">
    <a class="back" href="index.html">← Back home</a>

    <section class="submit-intro">
      <p class="label">FOR DEVELOPERS</p>
      <h1>Submit your game</h1>
      <p>Send the basic details and we can review it for the catalog.</p>
    </section>

    <form id="submit-form">
      <label>
        Game title
        <input name="title" required placeholder="Your game title">
      </label>

      <label>
        Description
        <textarea name="description" required rows="5" placeholder="Tell us about your game"></textarea>
      </label>

      <div class="two-columns">
        <label>
          Thumbnail image
          <input name="thumbnail" id="thumbnail" type="file" accept="image/*" required>
          <small id="thumbnail-name">Required</small>
        </label>

        <label>
          Second image
          <input name="image" id="image" type="file" accept="image/*" required>
          <small id="image-name">Required</small>
        </label>
      </div>

      <label>
        Optional video
        <input name="video" id="video" type="file" accept="video/*">
        <small id="video-name">Optional</small>
      </label>

      <label>
        Email
        <input name="email" type="email" required placeholder="you@example.com">
      </label>

      <label class="checkbox">
        <input name="permission" type="checkbox" required>
        <span>I own these assets and allow CrimDev to review them.</span>
      </label>

      <button class="button" type="submit">Submit game</button>

      <p class="note">
        The Discord webhook is a placeholder for now. Replace
        <code>DISCORD_WEBHOOK_URL</code> in <code>app.js</code> before using it.
      </p>

      <p id="status" class="status"></p>
    </form>
  </main>

  <footer>
    <span>© 2026 CrimDev</span>
    <a href="index.html">Home</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
